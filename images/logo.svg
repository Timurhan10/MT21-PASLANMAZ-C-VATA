<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <!-- Metallic silver gradient for background shape -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#718096;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A0AEC0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#718096;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
    <!-- Blue tech accent gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2B6CB0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4299E1;stop-opacity:1" />
    </linearGradient>
    <!-- Text metallic gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E2E8F0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#CBD5E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0AEC0;stop-opacity:1" />
    </linearGradient>
    <!-- Shine overlay -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="hexClip">
      <polygon points="40,5 70,5 80,20 80,60 70,75 40,75 30,60 30,20"/>
    </clipPath>
  </defs>

  <!-- Hexagon shape (bolt head reference) -->
  <polygon points="40,4 71,4 82,22 82,58 71,76 40,76 29,58 29,22"
           fill="url(#metalGrad)" filter="url(#shadow)"/>
  <!-- Hexagon shine -->
  <polygon points="40,4 71,4 82,22 82,38 55,4"
           fill="url(#shineGrad)"/>
  <!-- Blue accent line on hex -->
  <line x1="29" y1="39" x2="82" y2="39" stroke="url(#blueGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- MT21 text inside hexagon -->
  <text x="55.5" y="29" font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-size="14" font-weight="900" fill="url(#textGrad)"
        text-anchor="middle" letter-spacing="0">MT</text>
  <text x="55.5" y="62" font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="900" fill="url(#textGrad)"
        text-anchor="middle" letter-spacing="1">21</text>

  <!-- Company name text -->
  <text x="100" y="32" font-family="'Arial Black', 'Helvetica Neue', sans-serif"
        font-size="20" font-weight="900" fill="url(#textGrad)"
        letter-spacing="2">MT21</text>
  <!-- Divider line -->
  <line x1="100" y1="38" x2="272" y2="38" stroke="url(#blueGrad)" stroke-width="1.5"/>
  <!-- Subtitle -->
  <text x="100" y="55" font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="11" font-weight="400" fill="#A0AEC0"
        letter-spacing="3.5">PASLANMAZ CİVATA</text>
  <!-- Tagline -->
  <text x="100" y="70" font-family="'Arial', sans-serif"
        font-size="8.5" font-weight="300" fill="#718096"
        letter-spacing="1.5">STAINLESS FASTENERS</text>
</svg>
